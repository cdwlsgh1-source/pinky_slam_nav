name: pinky_bridge_pinky1_only

# [주의] 파이썬 스크립트가 namespace='pinky1'로 노드를 만들기 때문에
# 관제 PC(도메인 50) 쪽 토픽 이름은 전부 /pinky1/... 로 remap 해야 함.
# 로봇(도메인 20) 쪽은 원래 이름(/cmd_vel, /amcl_pose 등) 그대로 사용.

topics:
  # 관제 PC(50) -> 로봇(20)
  /pinky1/patrol_cmd:
    type: std_msgs/msg/String
    from_domain: 50
    to_domain: 20
    remap: /patrol_cmd

  /patrol_status:
    type: std_msgs/msg/String
    from_domain: 20
    to_domain: 50
    remap: /pinky1/patrol_status

  /pinky1/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 50
    to_domain: 20
    remap: /cmd_vel

  /pinky1/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 50
    to_domain: 20
    remap: /initialpose

  /pinky1/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 50
    to_domain: 20
    remap: /goal_pose

  # 로봇(20) -> 관제 PC(50)
  /scan:
    type: sensor_msgs/msg/LaserScan
    from_domain: 20
    to_domain: 50
    remap: /pinky1/scan

  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 20
    to_domain: 50
    remap: /pinky1/odom

  /tf:
    type: tf2_msgs/msg/TFMessage
    from_domain: 20
    to_domain: 50
    remap: /pinky1/tf

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    from_domain: 20
    to_domain: 50
    remap: /pinky1/tf_static

  # [중요] 도착 판정에 반드시 필요
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 20
    to_domain: 50
    remap: /pinky1/amcl_pose

  /battery_state:
    type: sensor_msgs/msg/BatteryState
    from_domain: 20
    to_domain: 50
    remap: /pinky1/battery_state

  # [주행 필수] lane_follower_node가 관제 PC(50)에서 실행되므로, 로봇(20)에서
  # 로컬로 도는 lane_detector_node(namespace=pinky1)가 발행하는 차선 정보를
  # 그대로 넘겨받아야 함. 로봇 쪽에서 이미 pinky1 네임스페이스를 쓰고 있어서
  # remap 없이 도메인만 건너가면 됨.
  /pinky1/lane/center_offset:
    type: std_msgs/msg/Float32
    from_domain: 20
    to_domain: 50

  /pinky1/lane/detected:
    type: std_msgs/msg/Bool
    from_domain: 20
    to_domain: 50

  /pinky1/crossline/detected:
    type: std_msgs/msg/Bool
    from_domain: 20
    to_domain: 50

  # === ZONE-MUTEX ADDED ======================================================
  # zone_manager_node는 관제 PC(도메인 50)에서만 실행됩니다.
  # 메시지 안에 "pinky1:토큰" 형태로 robot_id가 이미 포함되어 있어서
  # patrol_cmd/status와 달리 로봇별로 토픽 이름을 따로 remap할 필요가 없습니다.
  # (pinky2 쪽 브릿지 파일에도 이름을 동일하게 넣으면, 관제 PC의
  #  /zone_manager/request_entry 토픽 하나에 두 로봇이 함께 publish/subscribe함)

  # 로봇(20) -> 관제 PC(50): "구역 들어갈게요" 요청
  /zone_manager/request_entry:
    type: std_msgs/msg/String
    from_domain: 20
    to_domain: 50

  # 로봇(20) -> 관제 PC(50): "구역 나왔어요" 통보
  /zone_manager/notify_exit:
    type: std_msgs/msg/String
    from_domain: 20
    to_domain: 50

  # 관제 PC(50) -> 로봇(20): 진입 허가
  /zone_manager/grant_entry:
    type: std_msgs/msg/String
    from_domain: 50
    to_domain: 20
  # ============================================================================


