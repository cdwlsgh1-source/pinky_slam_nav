lane_detector_node:
  ros__parameters:
    # 학습한 YOLO segment 모델(클래스: 0=Crossline, 1=Lane) 경로
    model_path: /home/jinho/dev_ws/best.pt
    # 추론 입력 크기 (학습 imgsz와 동일하게 640)
    imgsz: 640
    # 검출 신뢰도 임계값. 오검출이 많으면 올릴 것
    conf: 0.5
    # 추론 장치 ('cpu' | '0' 등 GPU 인덱스)
    device: cpu
    # Crossline 클래스 id (data.yaml 기준)
    crossline_class_id: 0
    # 화면 하단 몇 %를 ROI로 볼지. 예전에 ros2 param set으로만 올렸다면 재시작 시
    # 코드 기본값(0.4)으로 되돌아갔을 것이므로 여기 명시적으로 넣어 유지되게 함
    lane_roi_ratio: 0.4
    # 차선 폭(좌~우 차선 사이 거리)의 초기 가정값(절반, 이미지 폭 대비). 양쪽이 다 보일 때마다 자동 학습됨
    assumed_half_lane_width_ratio: 0.35
    # 인스턴스의 실측 최하단이 화면 맨 아래 가장자리에서 이 비율(화면 높이 기준)보다
    # 멀리 떨어져 있으면 그쪽은 lane/left_detected(또는 right_detected)=False(바로
    # 추종하기엔 불확실)로 봄. offset/offset_trend 자체는 이 값과 무관하게 계속
    # 계산/발행됨(코너에서 끊기기 직전까지 방향 신호를 주기 위함)
    near_reach_ratio: 0.3
    # ROI 내 한 인스턴스의 y 분산이 이 비율보다 작으면(거의 점 하나) 그 인스턴스의
    # 회귀 기울기가 노이즈이므로 trend를 0으로 무시
    min_y_span_ratio: 0.05
    # 차선 폭 이동평균 계수 (0~1, 작을수록 천천히 갱신)
    lane_width_alpha: 0.1
    # 차선이 이 프레임 수 이상 연속으로 안 보이면 좌/우 이력(폭 추정 기준점)을 초기화
    history_reset_frames: 15
    # 마스크 x 폭이 화면 폭 대비 이 비율을 넘으면(세로 차선+전방 수평선이 합쳐진 경우)
    # 회귀 대신 최하단 띠의 x 평균으로 위치를 계산하고 trend는 0으로 무시
    wide_mask_ratio: 0.6
    # 위 경우에 쓰는 최하단 띠 높이 (화면 높이 대비 비율)
    bottom_band_ratio: 0.10
    # 마스크 x폭이 y폭의 이 배수를 넘는 가로로 누운 인스턴스(전방 수평선)는 좌/우 차선 후보에서 제외
    horiz_aspect: 2.5
    # 디버그 영상(lane/debug/compressed) 발행 여부. 구독자가 없으면 자동으로 생략됨
    debug_image: true
    # 디버그 영상 JPEG 압축 품질 (1~100)
    jpeg_quality: 80
