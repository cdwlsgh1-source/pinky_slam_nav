# 웹 GUI 백엔드 설정. 로봇 이름은 코드에 쓰지 않고 여기서만 정한다.
# robots 는 domain_bridge 가 관제 PC(domain 50)에 만들어 주는 /{id}/... 토픽의 {id} 이다.
robots:
  - pinky1
  - pinky2

# 구역 점유 상태 토픽 (zone_manager_node 발행, 값: free | occupied_by:<id>)
zone_status_topic: /zone_manager/status

# 어떤 토픽이든 마지막 수신 후 이 시간(초)이 지나면 online=false
online_timeout_sec: 5.0

# WebSocket 으로 내보내는 pose 이벤트의 로봇당 최대 빈도(Hz)
pose_max_hz: 10

# 지도 yaml (robots.yaml 이 있는 폴더 기준 상대 경로). 해상도, origin, 임계값은 이 파일에서 읽어 /api/map 으로 내려준다.
map_yaml: ../../map_view_pc/my_pinky_map10.yaml

# ---- 명령 패널 (Step 3) ----
# 점 좌표 yaml (robots.yaml 이 있는 폴더 기준 상대 경로)
points_yaml: points.yaml

# 명령 검증과 표시 규칙
max_goto_points: 10        # goto 한 번에 보낼 수 있는 최대 지점 수
no_response_sec: 5.0       # 명령 후 patrol_status 변화가 없으면 "응답 없음" 으로 표시하기까지의 시간
starting_notice_sec: 5.0   # STARTING 이 이 시간을 넘기면 "시작 준비 중" 안내 (첫 작업의 초기 위치 보정)
command_history_size: 50   # 명령 이력 보관 개수

# 로봇별 설정. 키는 robots 와 같아야 한다.
#   goto_allowed : 백엔드가 허용하는 goto 지점. RED* (구역 문)는 넣을 수 없다 (노드가 문 경유와 락을 처리한다).
#   home         : goto 완료 후 복귀하는 지점 (노드의 HOME_NAME)
#   goto_wait_sec: 지점 도착 후 대기 시간 (노드의 GOTO_WAIT_SEC), wait_every_point: 모든 지점에서 대기하는지
#   start_route  : start 순찰 경로 (노드의 WAYPOINTS 이름). 화면의 waypoint 번호 해석과 mock 이 쓴다.
robot_settings:
  pinky1:
    goto_allowed: [P1, P2, P3, P4, P5, P6, P7]
    home: P1
    goto_wait_sec: 10
    wait_every_point: true
    start_route: [P2, RED1IN, P3, P6, RED1OUT, P1]
  pinky2:
    goto_allowed: [P1, P2, P3, P4, P5, P6, P7]
    home: P7
    goto_wait_sec: 10
    wait_every_point: true
    start_route: [RED2IN, P3, P6, RED2OUT, P7]

# ---- 구역 / 비상정지 / 오버레이 (Step 4) ----
# 구역 영역 yaml (robots.yaml 이 있는 폴더 기준 상대 경로). 사각형과 문 위치를 정한다.
zone_yaml: zone.yaml

# 경로 추정 (지도 위의 선): 지점 사이를 직선이 아니라 지도의 벽을 피하는 최단 경로로 그린다. mock 로봇의 이동도 같은 경로를 따른다.
# Nav2 의 실제 계획이 아니라 지도 점유 격자 위의 추정이다 (/plan 토픽은 브리지에 없다). 벽에서 이만큼(m) 떨어진 칸만 지난다.
planner_inflation_m: 0.08

# 비상정지: patrol_cmd 로 stop 을 보내고, /{id}/cmd_vel 에 0 속도를 estop_burst_hz 로 estop_burst_sec 동안 보낸다.
# 첫 작업의 초기 위치 보정 회전 중에는 stop 이 즉시 먹지 않을 수 있어서 0 속도를 함께 보낸다.
motion:
  estop_burst_hz: 10
  estop_burst_sec: 2.0

# 수동 조작 (데드맨: 누르는 동안만). 입력이 input_timeout_sec 동안 없거나 WebSocket 이 끊기면 즉시 0 속도.
# max_* 는 설정값이고 코드에도 더 낮은 하드 상한이 있다 (선속도 0.2 m/s, 각속도 1.0 rad/s).
manual:
  enabled: true
  max_linear: 0.1        # m/s
  max_angular: 0.5       # rad/s
  input_timeout_sec: 0.5
  rate_hz: 10

# LiDAR 오버레이: 브라우저가 켰을 때만 /{id}/scan 을 구독한다. 대역폭을 위해 빈도와 점 수를 줄여서 보낸다.
scan:
  max_hz: 5
  decimate: 3            # 3개당 1개
  # 점의 위치와 방향은 로봇의 /tf, /tf_static (map -> odom -> base -> 센서) 에서 구한다. 센서가 돌려 달려 있어도 그대로 맞는다.
  # tf 를 못 구해서 amcl_pose 로 대신 그릴 때만 아래 보정 각도(도)를 쓴다. 센서가 로봇 정면과 다른 방향이면 로봇별로 적는다 (예: pinky1: 180).
  # 화면의 LiDAR 줄에 "tf" 인지 "amcl + 보정 N°" 인지 표시된다.
  yaw_offset_deg: {}

# ---- 프로세스 제어 (브릿지, zone_manager, 로봇 bringup/map 을 GUI 버튼으로) ----
# 실행할 수 있는 프로세스 목록 yaml. manager 로 로그인해야 쓸 수 있다 (--no-auth 면 꺼짐).
processes_yaml: processes.yaml
