# GUI 의 "시스템" 패널에서 켜고 끄는 프로세스 목록. 이 목록에 있는 것만 실행할 수 있다.
# 목록 순서가 [전체 시작] 순서이고, [전체 정지] 는 반대 순서다 (도메인 브릿지 -> bringup -> map -> zone_manager -> 순찰 노드).
#
# 로그인(manager 계정)이 필요하다. 서버를 --no-auth 로 띄우면 이 기능은 꺼진다.
# 비밀번호를 이 파일에 적지 않는다.
#
# 치환: {repo} = pinky_slam_nav 폴더의 절대 경로.
# detect  : pgrep -f 패턴(정규식). 시작 전에 같은 프로세스가 이미 도는지 확인한다 (터미널에서 직접 켠 것과 겹치지 않게).
#           영문/숫자로 시작해야 한다 (자기 자신을 찾지 않도록 서버가 첫 글자를 [x] 로 감싼다).
# group   : 시스템 패널에서 같은 이름끼리 한 묶음으로 보여 준다 (묶음 순서 = 처음 나온 순서). 비우면 '기타'.
# command : 비어 있으면 화면에 "명령 미설정" 으로 나오고 시작할 수 없다. 로봇 쪽 명령은 아래에서 직접 채운다.

defaults:
  local_source:
    - /opt/ros/jazzy/setup.bash
    - "{repo}/install/setup.bash"      # domain_bridge, zone_traffic_control 이 설치된 workspace

  # 로봇 터미널(~/.bashrc)에는 있지만 SSH 로 실행하면 빠지는 DDS 설정. 이게 빠지면 로봇이 기본 DDS(FastDDS)로 떠서
  # PC 의 CycloneDDS 브릿지와 토픽 이름만 보이고 데이터가 안 온다. 값은 로봇 터미널의 `env | grep -E "RMW|CYCLONE|ROS_"` 와 같게 둔다.
  pinky1_env: &pinky1_env
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: file:///home/pinky/.ros/cyclonedds_robot.xml
    ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
  
  pinky2_env: &pinky2_env
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: file:///home/pinky/.ros/cyclonedds_robot.xml   # pinky2 로봇 터미널의 값과 같게 둔다
    ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET

processes:
  # ---- 1. 도메인 브릿지 (관제 PC) ----
  # pinky1(20<->50) 과 pinky2(22<->50) 브릿지를 launch/bridges.launch.xml 하나로 같이 띄운다 (터미널의 ros2 launch 와 같다).
  # cwd 는 이 PC 의 저장소 경로다 (/home/pinky/... 는 로봇 경로라 PC 에 없다).
  # 브릿지를 먼저 켜면 로봇 토픽이 없을 때 구독이 기본 QoS(reliable)로 만들어져 best_effort 센서 토픽(/odom, /scan)이 안 넘어올 수 있다.
  # 그래서 [전체 시작] 은 bringup 이 켜진 뒤 로봇 토픽이 오는지 확인하고, 안 오면 restart_if_stalled 인 이 프로세스를 한 번 재시작한다.
  - id: bridge
    group: "도메인 브릿지"
    label: 도메인 브릿지 (pinky1, pinky2)
    kind: local
    domain: 50
    cwd: "{repo}"
    command: "ros2 launch launch/bridges.launch.xml"
    detect: "domain_bridge .*pinky_bridge_pinky"
    restart_if_stalled: true   # bringup 뒤에도 로봇 토픽이 안 오면 [전체 시작] 이 이 프로세스를 한 번 재시작한다

  # ---- 2, 3. 로봇 bringup, map (SSH, 키 로그인) ----
  # 사전 준비 (한 번만, 터미널에서 직접):
  #   ssh-copy-id <user>@<host>          # 이때 비밀번호를 터미널에 입력한다. 이후 서버는 키로만 접속한다.
  #   ssh <user>@<host> true             # 처음 접속 확인(known_hosts 등록)
  # 키 대신 비밀번호를 써야 하면 ssh.password_env 에 '환경 변수 이름' 을 적고 서버 실행 환경에 그 변수를 둔다 (sshpass 설치 필요).
  #
  # host, user, command 를 채우면 활성화된다 (pinky2 는 접속 주소만 있고 bringup/map 명령은 아직 비어 있다).
  # pinky2(192.168.45.22) 도 키 등록이 필요하다: ssh-copy-id pinky@192.168.45.22 (비밀번호는 터미널에서만 입력).
  # cwd    : 로봇에서 cd 할 절대 경로 (~ 불가). source 의 ./install/setup.bash 와 command 의 상대 경로 인자(map:=...)의 기준이다.
  # source : 로봇의 경로. SSH 는 ~/.bashrc 를 읽지 않으므로 ROS 배포판 setup.bash 도 여기에 적는다.
  # env    : 실행 전에 export 할 환경 변수. SSH 는 ~/.bashrc 를 안 읽어 RMW_IMPLEMENTATION, CYCLONEDDS_URI 도 빠지므로 여기서 준다.
  - id: bringup_pinky1
    group: bringup
    label: pinky1 bringup
    kind: ssh
    robot: pinky1
    health: true
    domain: 20
    ssh: {host: "192.168.45.20", user: "pinky", port: 22}
    cwd: /home/pinky      # 터미널의 기본 위치(~). map:=my_pinky_map10.yaml 이 여기서 찾아진다
    env: *pinky1_env
    source: ["/opt/ros/jazzy/setup.bash", "/home/pinky/pinky_slam_nav/install/setup.bash"]   # jazzy 는 로봇에서 확인함. SSH 는 ~/.bashrc 를 읽지 않으므로 명시한다
    command: "ros2 launch pinky_bringup bringup_robot.launch.xml"
    detect: "ros2 launch pinky_bringup"
  
  - id: bringup_pinky2
    group: bringup
    label: pinky2 bringup
    kind: ssh
    robot: pinky2
    health: true
    domain: 22
    ssh: {host: "192.168.45.22", user: "pinky", port: 22}
    cwd: /home/pinky      # 터미널의 기본 위치(~). map:=my_pinky_map10.yaml 이 여기서 찾아진다
    env: *pinky2_env
    source: ["/opt/ros/jazzy/setup.bash", "/home/pinky/pinky_slam_nav/install/setup.bash"]   # jazzy 는 로봇에서 확인함. SSH 는 ~/.bashrc 를 읽지 않으므로 명시한다
    command: "ros2 launch pinky_bringup bringup_robot.launch.xml"
    detect: "ros2 launch pinky_bringup"

  - id: map_pinky1
    group: map
    label: pinky1 map (Nav2)
    kind: ssh
    robot: pinky1
    domain: 20
    ssh: {host: "192.168.45.20", user: "pinky", port: 22}
    cwd: /home/pinky      # 터미널의 기본 위치(~). map:=my_pinky_map10.yaml 이 여기서 찾아진다
    env: *pinky1_env
    source: ["/opt/ros/jazzy/setup.bash", "/home/pinky/pinky_slam_nav/install/setup.bash"]   # jazzy 는 로봇에서 확인함. SSH 는 ~/.bashrc 를 읽지 않으므로 명시한다
    command: "ros2 launch pinky_navigation bringup_launch.xml map:=my_pinky_map10.yaml"
    detect: "ros2 launch pinky_navigation"
 
  - id: map_pinky2
    group: map
    label: pinky2 map (Nav2)
    kind: ssh
    robot: pinky2
    domain: 22
    ssh: {host: "192.168.45.22", user: "pinky", port: 22}
    cwd: /home/pinky      # 터미널의 기본 위치(~). map:=my_pinky_map10.yaml 이 여기서 찾아진다
    env: *pinky2_env
    source: ["/opt/ros/jazzy/setup.bash", "/home/pinky/pinky_slam_nav/install/setup.bash"]   # jazzy 는 로봇에서 확인함. SSH 는 ~/.bashrc 를 읽지 않으므로 명시한다
    command: "ros2 launch pinky_navigation bringup_launch.xml map:=my_pinky_map10.yaml"
    detect: "ros2 launch pinky_navigation"

  # ---- 4. zone_manager (관제 PC, 도메인 50) ----
  - id: zone_manager
    group: "zone_manager"
    label: zone_manager
    kind: local
    domain: 50
    command: "ros2 launch zone_traffic_control zone_manager.launch.xml"
    detect: "zone_manager_node"

  # ---- 5. 순찰 노드 ----
  # 순찰 노드: map(Nav2)이 올라온 뒤에 켠다 (노드가 Nav2 를 쓴다). 목록 순서 = 전체 시작 순서.
  # cwd 가 pinky_slam_nav 라서 ./install/setup.bash 를 상대 경로로 source 한다 (robot_id 는 노드 기본값 pinky1).
  - id: patrol_pinky1
    group: "순찰 노드"
    label: pinky1 순찰 노드
    kind: ssh
    robot: pinky1
    domain: 20
    ssh: {host: "192.168.45.20", user: "pinky", port: 22}
    cwd: /home/pinky/pinky_slam_nav
    env: *pinky1_env
    source: ["/opt/ros/jazzy/setup.bash", "./install/setup.bash"]
    command: "ros2 run my_pinky_package pinky_patrol_node_pinky1_v2"
    detect: "pinky_patrol_node_pinky1_v2"

  # pinky2 순찰 노드: pinky2 의 Nav2(map)가 올라온 뒤에 켠다. 로봇의 폴더와 ROS 경로는 pinky1 과 같다고 가정했다 (다르면 cwd/source 수정).
  - id: patrol_pinky2
    group: "순찰 노드"
    label: pinky2 순찰 노드
    kind: ssh
    robot: pinky2
    domain: 22
    ssh: {host: "192.168.45.22", user: "pinky", port: 22}
    cwd: /home/pinky/pinky_slam_nav
    env: *pinky2_env
    source: ["/opt/ros/jazzy/setup.bash", "./install/setup.bash"]
    command: "ros2 run my_pinky_package pinky_patrol_node_pinky2_v2"
    detect: "pinky_patrol_node_pinky2_v2"
