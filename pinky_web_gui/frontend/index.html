<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinky 관제</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 왼쪽: 메뉴바 -->
  <nav class="menubar" aria-label="메뉴">
    <div class="brand">Pinky</div>
    <button class="menu-item active" data-view="main">메인</button>
    <button class="menu-item" disabled title="준비 중">로그</button>
    <button class="menu-item" disabled title="준비 중">포인트</button>
  </nav>

  <!-- 위: 시스템 알람 -->
  <header class="alarmbar" aria-label="시스템 알람">
    <span class="chip" id="connChip" data-level="warn">연결 중...</span>
    <span class="chip" id="zoneChip" data-level="dim">구역: -</span>
    <ul class="alarm-list" id="alarmList"><li class="dim">알람 없음</li></ul>
  </header>

  <!-- 가운데: 지도 화면 -->
  <main class="mapwrap">
    <div class="stage" id="stage">
      <canvas id="mapCanvas"></canvas>
      <div class="stage-note" id="stageNote">지도 불러오는 중...</div>
      <div class="map-tools">
        <button id="gridBtn" type="button" aria-pressed="true" title="x, y 좌표 그리드 켜기/끄기">그리드</button>
        <button id="fitBtn" type="button" title="지도를 화면에 맞춤">맞춤</button>
      </div>
    </div>
    <div class="readout">
      <span><span class="tag">pixel</span> <b id="pxOut">-</b></span>
      <span><span class="tag">map (x, y)</span> <b id="xyOut">-</b></span>
      <span><span class="tag">occupancy</span> <b id="occOut">-</b></span>
    </div>
  </main>

  <!-- 오른쪽: 로봇 카드 / 명령어 / 클릭 좌표 -->
  <aside class="sidebar" aria-label="로봇과 명령">
    <section>
      <h2>로봇</h2>
      <div id="robotCards"></div>
    </section>

    <section>
      <h2>경로 이동 <small>(goto)</small></h2>
      <label class="field">대상 로봇 <select id="routeRobot"></select></label>
      <p class="hint">지도의 포인트(P1~P7)를 클릭하면 경로 끝에 추가됩니다. 구역 문(RED*)과 락은 로봇이 알아서 처리합니다.</p>
      <ol class="route" id="routeList"></ol>
      <p class="hint" id="routeEmpty">경로가 비어 있습니다.</p>
      <div class="row-actions"><button type="button" id="routeClearBtn">경로 비우기</button></div>
      <p class="hint" id="routeMeta"></p>
    </section>

    <section>
      <h2>클릭 좌표 <small>(waypoint 지정용)</small></h2>
      <div class="row-actions">
        <button type="button" id="copyAllBtn">전체 복사</button>
        <button type="button" id="clearBtn">지우기</button>
      </div>
      <p class="hint" id="pointsEmpty">지도를 클릭하면 좌표가 기록됩니다.</p>
      <ul class="points" id="pointsList"></ul>
    </section>
  </aside>

  <!-- 아래: 명령 이력 -->
  <section class="history" aria-label="명령 이력">
    <h2>명령 이력 <small>(최근 50건)</small></h2>
    <div class="history-scroll">
      <table>
        <thead><tr><th>시각</th><th>로봇</th><th>명령</th><th>결과</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
      <p class="hint" id="historyEmpty">보낸 명령이 없습니다.</p>
    </div>
  </section>

</div>

<dialog id="confirmDlg">
  <form method="dialog">
    <p id="confirmText"></p>
    <div class="row-actions">
      <button value="ok" id="confirmOk" class="primary">보내기</button>
      <button value="cancel">취소</button>
    </div>
  </form>
</dialog>

<script src="mapmath.js"></script>
<script src="patrolview.js"></script>
<script src="app.js"></script>
</body>
</html>
