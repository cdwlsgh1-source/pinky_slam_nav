name: pinky_bridge_pinky2_only

topics:
  # 관제 PC(50) -> 핑키2(22)
  /pinky2/patrol_cmd:
    type: std_msgs/msg/String
    from_domain: 50
    to_domain: 22
    remap: /patrol_cmd

  /patrol_status:
    type: std_msgs/msg/String
    from_domain: 22
    to_domain: 50
    remap: /pinky2/patrol_status

  /pinky2/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 50
    to_domain: 22
    remap: /cmd_vel

  /pinky2/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 50
    to_domain: 22
    remap: /initialpose

  /pinky2/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 50
    to_domain: 22
    remap: /goal_pose

  # 핑키2(22) -> 관제 PC(50)
  /scan:
    type: sensor_msgs/msg/LaserScan
    from_domain: 22
    to_domain: 50
    remap: /pinky2/scan

  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 22
    to_domain: 50
    remap: /pinky2/odom

  /tf:
    type: tf2_msgs/msg/TFMessage
    from_domain: 22
    to_domain: 50
    remap: /pinky2/tf

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    from_domain: 22
    to_domain: 50
    remap: /pinky2/tf_static

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 22
    to_domain: 50
    remap: /pinky2/amcl_pose

  /battery_state:
    type: sensor_msgs/msg/BatteryState
    from_domain: 22
    to_domain: 50
    remap: /pinky2/battery_state

  # 로봇은 /battery_state 대신 Float32 두 개(/battery/percent, /battery/voltage)를 발행함.
  # 웹 GUI 백엔드가 이 두 토픽을 구독한다.
  /battery/percent:
    type: std_msgs/msg/Float32
    from_domain: 22
    to_domain: 50
    remap: /pinky2/battery/percent

  /battery/voltage:
    type: std_msgs/msg/Float32
    from_domain: 22
    to_domain: 50
    remap: /pinky2/battery/voltage

  # === ZONE-MUTEX ADDED ======================================================
  # zone_manager_node는 관제 PC(도메인 50)에서만 실행됩니다.
  # 메시지 안에 "pinky2:토큰" 형태로 robot_id가 이미 포함되어 있어서
  # patrol_cmd/status와 달리 로봇별로 토픽 이름을 따로 remap할 필요가 없습니다.
  # (pinky1 쪽 브릿지 파일과 토픽 이름을 동일하게 맞춰서, 관제 PC의
  #  /zone_manager/request_entry 토픽 하나에 두 로봇이 함께 publish/subscribe함)

  # 로봇(22) -> 관제 PC(50): "구역 들어갈게요" 요청
  /zone_manager/request_entry:
    type: std_msgs/msg/String
    from_domain: 22
    to_domain: 50

  # 로봇(22) -> 관제 PC(50): "구역 나왔어요" 통보
  /zone_manager/notify_exit:
    type: std_msgs/msg/String
    from_domain: 22
    to_domain: 50

  # 관제 PC(50) -> 로봇(22): 진입 허가
  /zone_manager/grant_entry:
    type: std_msgs/msg/String
    from_domain: 50
    to_domain: 22
  # ============================================================================

  # === ZONE-QUEUE-V3 ADDED ===================================================
  # zone_manager_node_v3(대기열 슬롯 방식) 전용. 토픽 이름이 /zone_manager_v3/* 라서
  # 위의 /zone_manager/* (v1) 와 섞이지 않는다. 메시지에 robot_id 가 들어 있어 remap 불필요.
  # status 는 매니저와 GUI 가 모두 관제 PC(50)에 있어 도메인을 건너갈 일이 없으므로 넣지 않는다.
  # [복구] 이 블록(ZONE-QUEUE-V3 ADDED ~ END)만 지우면 v2 구성으로 돌아간다 (PRD 6절).

  # 로봇(22) -> 관제 PC(50): 진입 요청 (대기 중 1초마다 재전송)
  /zone_manager_v3/request_entry:
    type: std_msgs/msg/String
    from_domain: 22
    to_domain: 50

  # 로봇(22) -> 관제 PC(50): 구역 이탈 통보
  /zone_manager_v3/notify_exit:
    type: std_msgs/msg/String
    from_domain: 22
    to_domain: 50

  # 로봇(22) -> 관제 PC(50): 대기 포기 (stop / 이동 실패 / queue_full)
  /zone_manager_v3/cancel_entry:
    type: std_msgs/msg/String
    from_domain: 22
    to_domain: 50

  # 관제 PC(50) -> 로봇(22): 진입 허가
  /zone_manager_v3/grant_entry:
    type: std_msgs/msg/String
    from_domain: 50
    to_domain: 22

  # 관제 PC(50) -> 로봇(22): 대기 슬롯 좌표 "robot_id:k:x,y,yaw" (k=-1 이면 대기열 가득 참)
  /zone_manager_v3/queue_slot:
    type: std_msgs/msg/String
    from_domain: 50
    to_domain: 22
  # === ZONE-QUEUE-V3 END =====================================================
