name: pinky_bridge_pinky1_only

# [주의] 파이썬 스크립트가 namespace='pinky1'로 노드를 만들기 때문에
# 관제 PC(도메인 100) 쪽 토픽 이름은 전부 /pinky1/... 로 remap 해야 함.
# 로봇(도메인 10) 쪽은 원래 이름(/cmd_vel, /amcl_pose 등) 그대로 사용.

topics:
  # 관제 PC(100) -> 로봇(10)
  /pinky1/patrol_cmd:
    type: std_msgs/msg/String
    from_domain: 100
    to_domain: 10
    remap: /patrol_cmd

  /patrol_status:
    type: std_msgs/msg/String
    from_domain: 10
    to_domain: 100
    remap: /pinky1/patrol_status

  /pinky1/cmd_vel:
    type: geometry_msgs/msg/Twist
    from_domain: 100
    to_domain: 10
    remap: /cmd_vel

  /pinky1/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 100
    to_domain: 10
    remap: /initialpose

  /pinky1/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 100
    to_domain: 10
    remap: /goal_pose

  # 로봇(10) -> 관제 PC(100)
  /scan:
    type: sensor_msgs/msg/LaserScan
    from_domain: 10
    to_domain: 100
    remap: /pinky1/scan

  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 10
    to_domain: 100
    remap: /pinky1/odom

  /tf:
    type: tf2_msgs/msg/TFMessage
    from_domain: 10
    to_domain: 100
    remap: /pinky1/tf

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    from_domain: 10
    to_domain: 100
    remap: /pinky1/tf_static

  # [중요] 도착 판정에 반드시 필요
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 10
    to_domain: 100
    remap: /pinky1/amcl_pose

  /battery_state:
    type: sensor_msgs/msg/BatteryState
    from_domain: 10
    to_domain: 100
    remap: /pinky1/battery_state

  # 로봇은 /battery_state 대신 Float32 두 개(/battery/percent, /battery/voltage)를 발행함.
  # 웹 GUI 백엔드가 이 두 토픽을 구독한다.
  /battery/percent:
    type: std_msgs/msg/Float32
    from_domain: 10
    to_domain: 100
    remap: /pinky1/battery/percent

  /battery/voltage:
    type: std_msgs/msg/Float32
    from_domain: 10
    to_domain: 100
    remap: /pinky1/battery/voltage

  # [주행 필수] lane_follower_node가 관제 PC(100)에서 실행되므로, 로봇(10)에서
  # 로컬로 도는 lane_detector_node(namespace=pinky1)가 발행하는 차선 정보를
  # 그대로 넘겨받아야 함. 로봇 쪽에서 이미 pinky1 네임스페이스를 쓰고 있어서
  # remap 없이 도메인만 건너가면 됨.
  /pinky1/lane/center_offset:
    type: std_msgs/msg/Float32
    from_domain: 10
    to_domain: 100

  /pinky1/lane/detected:
    type: std_msgs/msg/Bool
    from_domain: 10
    to_domain: 100

  /pinky1/crossline/detected:
    type: std_msgs/msg/Bool
    from_domain: 10
    to_domain: 100

  # === ZONE-QUEUE ADDED ===================================================
  # zone_manager_node(대기열 슬롯 방식) 전용. 메시지에 robot_id 가 들어 있어 로봇별 remap 은 필요 없다.
  # status 는 매니저와 GUI 가 모두 관제 PC(100)에 있어 도메인을 건너갈 일이 없으므로 넣지 않는다.

  # 로봇(10) -> 관제 PC(100): 진입 요청 (대기 중 1초마다 재전송)
  /zone_manager/request_entry:
    type: std_msgs/msg/String
    from_domain: 10
    to_domain: 100

  # 로봇(10) -> 관제 PC(100): 구역 이탈 통보
  /zone_manager/notify_exit:
    type: std_msgs/msg/String
    from_domain: 10
    to_domain: 100

  # 로봇(10) -> 관제 PC(100): 대기 포기 (stop / 이동 실패 / queue_full)
  /zone_manager/cancel_entry:
    type: std_msgs/msg/String
    from_domain: 10
    to_domain: 100

  # 관제 PC(100) -> 로봇(10): 진입 허가
  /zone_manager/grant_entry:
    type: std_msgs/msg/String
    from_domain: 100
    to_domain: 10

  # 관제 PC(100) -> 로봇(10): 대기 슬롯 좌표 "robot_id:k:x,y,yaw" (k=-1 이면 대기열 가득 참)
  /zone_manager/queue_slot:
    type: std_msgs/msg/String
    from_domain: 100
    to_domain: 10
  # === ZONE-QUEUE END =====================================================
