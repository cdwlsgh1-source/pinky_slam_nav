zone_manager_node_v3:
  ros__parameters:
    # zone_gate_client_v3를 쓰는 로봇들의 robot_id 목록 (patrol 노드의 robot_id 파라미터와 일치해야 함)
    robot_ids: ["pinky1", "pinky2"]
    # 로봇이 notify_exit를 못 보내는 비상 상황(크래시 등)에 대비한 강제 해제 시간(초)
    max_hold_sec: 120.0

    # ---- 대기열 (map 좌표계) ----
    # queue_anchor 는 실측값(2026-10-13). 앵커는 점유자의 이탈 경로(RED*OUT)와 겹치지 않아야 함
    # 슬롯 k = 앵커 + k * spacing * back_dir  ->  0:(0.60,-0.70)  1:(0.40,-0.70)  2:(0.20,-0.70)
    # 간격 d = 0.20 m: 로봇 지름 약 0.10 m + 여유 0.10 m (사용자 지정, 2026-10-13)
    # 주의: Nav2 xy_goal_tolerance 가 0.25 m 이면 도착 판정 오차가 간격보다 크다 (PRD 4절 11번).
    #       back_dir 은 -x 방향(홈 쪽) 그대로이며 T3 에서 확인 후 확정.
    queue_anchor: [0.6, -0.7, 0.0]      # slot 0 위치 [x, y, yaw(rad)]  (실측)
    queue_back_dir: [-1.0, 0.0]         # 줄이 늘어나는 방향 (자동으로 단위벡터로 정규화)
    queue_spacing: 0.20                 # 슬롯 간격 d (m)
    queue_max: 3                        # 최대 대기자 수 (넘으면 k=-1 거부)
    queue_stale_sec: 5.0                # request_entry 재전송이 이 시간 끊기면 큐에서 제거
    queue_advance_delay_sec: 1.5        # 앞 로봇이 앵커를 떠날 시간을 준 뒤 뒤 로봇을 전진 (0이면 즉시)
