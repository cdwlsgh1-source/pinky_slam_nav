zone_manager_node_v3:
  ros__parameters:
    # zone_gate_client_v3를 쓰는 로봇들의 robot_id 목록 (patrol 노드의 robot_id 파라미터와 일치해야 함)
    robot_ids: ["pinky1", "pinky2", "pinky3"]
    # 로봇이 notify_exit를 못 보내는 비상 상황(크래시 등)에 대비한 강제 해제 시간(초)
    max_hold_sec: 120.0

    # ---- 대기열 (map 좌표계) ----
    # queue_anchor 는 실측값(2026-10-13, 0.6 -> 0.8 -> 1.0 으로 현장 조정). 앵커는 점유자의 이탈 경로(ZONE_EXIT)와 겹치지 않아야 함
    # 슬롯 k = 앵커 + k * spacing * back_dir  ->  0:(1.00,-0.70)  1:(0.70,-0.70)  2:(0.40,-0.70)
    # 간격 d = 0.30 m (사용자 의도값). 0.20 m 에서는 로봇끼리 부딪혔고, 0.50 m 도 시험했으나 0.30 m 로 확정 (2026-10-14)
    # 슬롯 2 (0.40,-0.70) 는 pinky2·pinky3(임시) 홈 P7(0.0,-0.6) 과 약 0.41 m 라 queue_max 3 이어도 겹치지 않음.
    #       back_dir 은 -x 방향(홈 쪽) 그대로이며 T3 에서 확인 후 확정.
    queue_anchor: [1.0, -0.7, 0.0]      # slot 0 위치 [x, y, yaw(rad)]  (실측)
    queue_back_dir: [-1.0, 0.0]         # 줄이 늘어나는 방향 (자동으로 단위벡터로 정규화)
    queue_spacing: 0.30                 # 슬롯 간격 d (m)
    queue_max: 3                        # 최대 대기자 수 (넘으면 k=-1 거부)
    queue_stale_sec: 5.0                # request_entry 재전송이 이 시간 끊기면 큐에서 제거
    queue_advance_delay_sec: 3.0        # 앞 로봇이 앵커를 떠날 시간을 준 뒤 뒤 로봇을 전진 (0이면 즉시)
