zone_manager_node_v2:
  ros__parameters:
    robot_ids: ["pinky1", "pinky2"]
    pose_topic_pattern: "/{robot_id}/amcl_pose"

    # 토큰을 발행할 구역 (map 좌표계, m)  -- TODO: 실제 값으로 수정
    zone_center_x: 1.0     # 구역 중심 (map 좌표계, m)  (1.0, -0.6)
    zone_center_y: -0.6
    zone_radius: 0.5       # 진입 판정 반경
    exit_margin: 0.2       # 이탈 반경 = 0.5 + 0.2

    # 로봇별 정지(대기) 좌표 [x, y, yaw(rad)]  -- TODO: 구역 반경 밖의 안전한 위치로 수정
    hold_pinky1: [0.6, -0.4, 0.0] 
    hold_pinky2: [0.6, -0.4, 0.0] 

    max_hold_sec: 120.0
    pose_timeout_sec: 2.0
    republish_period_sec: 1.0
